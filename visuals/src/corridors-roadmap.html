<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
/* S3 corridors: US-India arc launching; Japan and Europe as dashed candidates. Map at top:20px. */
.map{position:absolute;left:0;top:20px;width:800px;height:400px;animation:fadeIn .5s .05s both}
svg.ov{position:absolute;left:0;top:0;width:800px;height:500px;overflow:visible}
.arc{fill:none;stroke-linecap:round}
.arc.main{stroke:var(--saffron);stroke-width:4.5;stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .5s forwards}
.arc.glow{stroke:rgba(245,158,11,.2);stroke-width:16;stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .5s forwards,breathe 1.6s ease-in-out 1.8s infinite alternate}
@keyframes breathe{from{stroke:rgba(245,158,11,.12)}to{stroke:rgba(245,158,11,.34)}}
.arc.next{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 7;opacity:0;animation:fadeIn .6s var(--d) both,march 1s linear var(--d) infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);animation:pop .4s var(--d) both,pulse 1.6s ease-out var(--d) infinite}
.pin.us{background:var(--saffron);left:216px;top:134px;--d:.2s}
.pin.in{background:var(--saffron);left:564px;top:196px;--d:1.2s}
.pin.jp{background:#fff;border-color:var(--blue);left:710px;top:147px;--d:2.2s;animation:pop .4s var(--d) both}
.pin.eu{background:#fff;border-color:var(--blue);left:422px;top:103px;--d:2.5s;animation:pop .4s var(--d) both}
.tag{position:absolute;padding:8px 12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.live{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-50)}
.cand{font-size:16px;font-weight:700;color:var(--blue)}
.whow{position:absolute;left:0;right:0;top:392px;display:flex;justify-content:center}
.who{padding:14px 20px;display:grid;gap:6px;text-align:center;white-space:nowrap}
.who .k{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
</style></head>
<body data-ms="9000" style="--T:9s"><div class="stage">
  <img class="map" src="worldmap.svg">
  <svg class="ov" viewBox="0 0 800 500">
    <path class="arc glow" d="M216 134 Q390 -20 564 196"/>
    <path class="arc main" d="M216 134 Q390 -20 564 196"/>
    <path class="arc next" style="--d:2.1s" d="M564 196 Q660 120 710 147"/>
    <path class="arc next" style="--d:2.4s" d="M216 134 Q320 60 422 103"/>
  </svg>
  <div class="pin us"></div><div class="pin in"></div><div class="pin jp"></div><div class="pin eu"></div>

  <div class="card tag pop" style="left:440px;top:222px;--d:1.4s"><span class="live"></span><span class="t22">Launching · US ↔ India</span></div>
  <div class="card tag pop" style="left:628px;top:96px;--d:2.4s"><span class="cand">Candidate · Japan</span></div>
  <div class="card tag pop" style="left:300px;top:150px;--d:2.7s"><span class="cand">Candidate · Europe</span></div>

  <div class="whow"><div class="card who in" style="--d:3s"><div class="k">Buyers in India</div>
    <div class="t18">Corporate development teams · PE funds · buy-side brokers</div></div></div>
</div></body></html>
