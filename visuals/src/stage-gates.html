<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.gates{position:absolute;left:0;top:64px;width:800px;height:150px}
.track{position:absolute;left:70px;width:660px;top:29px;height:6px;background:#E3E9F5;border-radius:3px}
.fill{position:absolute;left:70px;width:660px;top:29px;height:6px;background:var(--green);border-radius:3px;transform-origin:left;animation:grow 2.3s linear 3.4s both}
.g{position:absolute;top:0;width:98px;margin-left:-49px;text-align:center}
.g .dot{width:64px;height:64px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid #D5DDEE;position:relative;box-shadow:0 2px 6px rgba(14,26,51,.06)}
.g .dot .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--ink-3)}
.g .lbl{margin-top:10px;font-size:16px;font-weight:700;line-height:1.2}
.ok,.bad{position:absolute;inset:-3px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px}
.ok{background:var(--green);animation:pop .35s var(--d) both}
.bad{background:var(--red);animation:flagShow 2.2s 1s both}
@keyframes flagShow{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1)}88%{opacity:1}100%{opacity:0}}
.tok{position:absolute;left:0;top:0;offset-path:path('M70 -26 L730 -26');offset-rotate:0deg;animation:move 2.3s cubic-bezier(.4,0,.2,1) 3.4s both}
.tok .agent{animation:pop .4s .3s both}
@keyframes move{from{offset-distance:0%}to{offset-distance:100%}}
.panel{position:absolute;left:32px;right:32px;top:250px;bottom:28px;padding:14px 24px}
.hd{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-weight:600;padding-bottom:6px}
.row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.row .txt{flex:1}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;position:relative}
.st{position:relative;width:110px;height:32px;flex:none}
.st .chip{position:absolute;right:0;top:0}
.st .f{animation:flagShow 2.2s 1s both}
</style></head>
<body data-ms="9500" style="--T:9.5s"><div class="stage">
  <div class="gates">
    <div class="track"></div><div class="fill"></div>
    <div class="g" style="left:70px"><div class="dot"><span class="n">1</span><span class="bad">!</span><span class="ok" style="--d:3.2s">✓</span></div><div class="lbl">Mandate</div></div>
    <div class="g" style="left:180px"><div class="dot"><span class="n">2</span><span class="ok" style="--d:3.8s">✓</span></div><div class="lbl">Collateral</div></div>
    <div class="g" style="left:290px"><div class="dot"><span class="n">3</span><span class="ok" style="--d:4.15s">✓</span></div><div class="lbl">Anonymous teaser</div></div>
    <div class="g" style="left:400px"><div class="dot"><span class="n">4</span><span class="ok" style="--d:4.55s">✓</span></div><div class="lbl">NDA</div></div>
    <div class="g" style="left:510px"><div class="dot"><span class="n">5</span><span class="ok" style="--d:4.9s">✓</span></div><div class="lbl">LOI</div></div>
    <div class="g" style="left:620px"><div class="dot"><span class="n">6</span><span class="ok" style="--d:5.3s">✓</span></div><div class="lbl">Due diligence</div></div>
    <div class="g" style="left:730px"><div class="dot"><span class="n">7</span><span class="ok" style="--d:5.7s">✓</span></div><div class="lbl">SPA &amp; closing</div></div>
    <div class="tok"><div class="agent ai" style="margin:-19px 0 0 -19px">AI</div></div>
  </div>

  <div class="card panel in" style="--d:.4s">
    <div class="hd"><div class="agent ai sm">AI</div><span class="t16">AI agent · mandate check</span></div>
    <div class="row in" style="--d:1s">
      <span class="ic" style="background:var(--red)">!<span class="ok" style="--d:3.2s;font-size:17px">✓</span></span>
      <span class="txt t22">Contradiction: stated EBITDA ≠ tax return</span>
      <span class="st"><span class="chip r lg f">Flagged</span><span class="chip g lg pop" style="--d:3.2s">Fixed</span></span>
    </div>
    <div class="row in" style="--d:2.1s">
      <span class="agent provider sm" style="flex:none;width:30px;height:30px">S</span>
      <span class="txt t22">Accounting specialist called in</span>
    </div>
    <div class="row in" style="--d:3.2s">
      <span class="ic" style="background:var(--green)">✓</span>
      <span class="txt t22">Broker approves · deal proceeds to closing</span>
    </div>
  </div>
</div></body></html>
