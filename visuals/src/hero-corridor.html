<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
/* S1 hero: US company -> anonymous teaser -> buyer in India; AI agents confirm fit; KYC + broker approval; NDA. */
.map{position:absolute;left:0;top:40px;width:800px;height:400px;animation:fadeIn .5s .05s both}
svg.ov{position:absolute;left:0;top:0;width:800px;height:500px;overflow:visible}
.arc{fill:none;stroke-linecap:round}
.arc.main{stroke:var(--saffron);stroke-width:4;stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .5s forwards}
.arc.glow{stroke:rgba(245,158,11,.2);stroke-width:16;stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .5s forwards}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);animation:pop .4s var(--d) both,pulse 1.6s ease-out var(--d) infinite}
.pin.us{background:var(--saffron);left:216px;top:154px;--d:.2s}
.pin.in{background:var(--blue);left:564px;top:216px;--d:.9s}
.party{position:absolute;width:262px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.party .agent{flex:none}
.party.seller{left:20px;top:214px}
.party.buyer{left:500px;top:262px;width:280px}
.teaser{position:absolute;left:0;top:0;offset-path:path('M216 154 Q390 0 564 216');offset-rotate:0deg;
  padding:7px 12px;font-size:16px;font-weight:700;white-space:nowrap;opacity:0;animation:travel 1.6s cubic-bezier(.5,0,.3,1) 1.1s both}
@keyframes travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.meet{position:absolute;left:390px;top:92px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px}
.meet .agent{animation:pop .4s var(--d) both}
.ctr{position:absolute;left:400px;transform:translateX(-50%)}
.ctr .chip{animation:pop .4s var(--d) both}
.dealw{position:absolute;left:0;right:0;top:408px;display:flex;justify-content:center}
.deal{padding:14px 20px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.deal .tick{width:28px;height:28px;font-size:16px}
</style></head>
<body data-ms="9000" style="--T:9s"><div class="stage">
  <img class="map" src="worldmap.svg">
  <svg class="ov" viewBox="0 0 800 500">
    <path class="arc glow" d="M216 154 Q390 0 564 216"/>
    <path class="arc main" d="M216 154 Q390 0 564 216"/>
  </svg>
  <div class="pin us"></div><div class="pin in"></div>

  <div class="card party seller in" style="--d:.3s"><div class="agent seller">S</div>
    <div><div class="t22">US company</div><div class="t16 muted">Ohio · sell-side broker</div></div></div>
  <div class="card party buyer in" style="--d:1s"><div class="agent buyer">B</div>
    <div><div class="t22">Buyer in India</div><div class="t16 muted">Mumbai · buy-side broker</div></div></div>

  <div class="card teaser">Anonymous teaser</div>

  <div class="meet"><div class="agent ai" style="--d:2.6s">AI</div><div class="agent ai" style="--d:2.7s">AI</div></div>
  <div class="ctr" style="top:20px"><span class="chip g lg" style="--d:2.8s">✓ AI agents confirm fit</span></div>
  <div class="ctr" style="top:150px"><span class="chip t lg" style="--d:3.6s">✓ KYC passed · broker approves</span></div>

  <div class="dealw"><div class="card deal pop" style="--d:4.4s"><span class="tick">✓</span><span class="t22">NDA signed · names revealed</span></div></div>
</div></body></html>
