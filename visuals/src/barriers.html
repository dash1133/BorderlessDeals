<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
/* S4 problem only: six horizontal walls between a US company and a buyer in India. No fixes. */
.party{position:absolute;top:176px;width:188px;padding:16px;display:grid;justify-items:center;gap:8px;text-align:center}
.party.l{left:20px}.party.r{left:592px}
.wall{position:absolute;left:250px;top:44px;width:300px;display:grid;gap:10px}
.brick{height:48px;border-radius:10px;background:var(--red-50);border:1.5px solid #F5B5B5;display:flex;align-items:center;gap:12px;padding:0 16px;
  font-size:20px;font-weight:700;color:#7F1D1D;animation:brick .45s cubic-bezier(.2,.7,.2,1) var(--d) both}
@keyframes brick{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
.brick .x{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
svg.ov{position:absolute;inset:0;width:800px;height:500px}
.try{fill:none;stroke:var(--saffron);stroke-width:3;stroke-dasharray:6 6;stroke-linecap:round;opacity:0;animation:fadeIn .3s var(--d) both}
.try.b{stroke:var(--blue)}
.probe{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;top:242px;opacity:0;animation:bump 1.4s ease-in-out var(--d) infinite}
@keyframes bump{0%{opacity:0;transform:translateX(0)}15%{opacity:1}55%{transform:translateX(var(--dx))}70%{transform:translateX(calc(var(--dx) * .7))}100%{opacity:0;transform:translateX(calc(var(--dx) * .7))}}
.out{position:absolute;left:0;right:0;top:440px;display:flex;justify-content:center}
.out .chip{animation:pop .4s 3s both}
</style></head>
<body data-ms="9000" style="--T:9s"><div class="stage">
  <svg class="ov" viewBox="0 0 800 500">
    <path class="try" style="--d:2.4s" d="M208 242 L244 242"/>
    <path class="try b" style="--d:2.4s" d="M556 242 L592 242"/>
  </svg>
  <div class="probe" style="left:214px;background:var(--saffron);--dx:28px;--d:2.5s"></div>
  <div class="probe" style="left:586px;background:var(--blue);--dx:-28px;--d:2.6s"></div>

  <div class="card party l in" style="--d:.2s"><div class="agent seller">S</div><div class="t22">US company</div><div class="t16 muted">via local broker</div></div>
  <div class="card party r in" style="--d:.35s"><div class="agent buyer">B</div><div class="t22">Buyer in India</div><div class="t16 muted">can't see US companies</div></div>

  <div class="wall">
    <div class="brick" style="--d:.6s"><span class="x">✕</span>Discovery</div>
    <div class="brick" style="--d:.9s"><span class="x">✕</span>Information &amp; language</div>
    <div class="brick" style="--d:1.2s"><span class="x">✕</span>Regulation</div>
    <div class="brick" style="--d:1.5s"><span class="x">✕</span>Trust</div>
    <div class="brick" style="--d:1.8s"><span class="x">✕</span>Execution cost</div>
    <div class="brick" style="--d:2.1s"><span class="x">✕</span>Local reach</div>
  </div>
  <div class="out"><span class="chip r lg">Out of reach today</span></div>
</div></body></html>
