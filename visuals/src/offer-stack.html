<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.list{position:absolute;left:32px;top:32px;width:500px;display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:60px}
.item .tick{width:30px;height:30px;font-size:17px;flex:none}
.item .tick{animation:pop .35s calc(var(--d) + .25s) both}
.price{position:absolute;left:552px;top:32px;width:216px;height:276px;border-radius:16px;background:var(--blue);color:#fff;
  padding:24px 20px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 16px 40px rgba(31,79,224,.3)}
.price .eb{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.price .big{font-size:34px;white-space:nowrap;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:12px 0}
.price .sub{font-size:18px;opacity:.9}
.promise{position:absolute;left:32px;right:32px;top:336px;bottom:32px;border-radius:14px;background:var(--green-50);
  display:flex;align-items:center;gap:16px;padding:0 24px;color:#14532D}
.promise .seal{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
</style></head>
<body data-ms="9000" style="--T:9s"><div class="stage">
  <div class="price pop" style="--d:.4s">
    <div class="eb">Founding broker</div>
    <div class="big">Free seat</div>
    <div class="sub">For founding brokers</div>
  </div>
  <div class="list">
    <div class="card item sr" style="--d:.9s"><span class="tick">✓</span><span class="t22">Free seat for founding brokers</span></div>
    <div class="card item sr" style="--d:1.4s"><span class="tick">✓</span><span class="t22">AI agent drafts teaser and buyer list</span></div>
    <div class="card item sr" style="--d:1.9s"><span class="tick">✓</span><span class="t22">Ratings and closed-deal record</span></div>
    <div class="card item sr" style="--d:2.4s"><span class="tick">✓</span><span class="t22">One system for every mandate</span></div>
  </div>
  <div class="promise in" style="--d:3.2s"><span class="seal">✓</span>
    <span class="t22">You keep your mandate, client and fee. No percentage of your deal.</span></div>
</div></body></html>
