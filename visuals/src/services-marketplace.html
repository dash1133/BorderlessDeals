<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.req{position:absolute;left:32px;top:32px;width:356px;padding:20px 22px}
.req .t22{margin-top:12px}
.req .meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.room{position:absolute;left:32px;top:276px;width:356px;bottom:32px;padding:18px 22px}
.room .hd{display:flex;align-items:center;gap:10px}
.file{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:10px}
.file .ico{width:26px;height:32px;border-radius:4px;background:#E8EDF7;flex:none;position:relative}
.file .ico::after{content:"";position:absolute;right:0;top:0;border-left:8px solid #D2DAEA;border-bottom:8px solid #D2DAEA;border-top:8px solid #fff;border-right:8px solid #fff}
.file.new{animation:fadeUp .4s 5.2s both}
.file.new .ico{background:var(--violet-50)}
.props{position:absolute;left:412px;top:32px;width:356px}
.props .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bid{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;position:relative}
.bid .skel{display:grid;gap:6px;margin-top:8px}
.bid .agent{flex:none}
.pick{position:absolute;inset:-2px;border:3px solid var(--blue);border-radius:12px;animation:fadeIn .3s 3.1s both;pointer-events:none}
.hired{position:absolute;right:12px;top:12px}
.verdict{position:absolute;left:412px;top:392px;width:356px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.fly{position:absolute;left:0;top:0;offset-path:path('M560 100 C 500 250 330 330 200 420');offset-rotate:0deg;opacity:0;animation:flyDoc 1s cubic-bezier(.5,0,.3,1) 4.3s both}
@keyframes flyDoc{0%{offset-distance:0%;opacity:0}10%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
</style></head>
<body data-ms="9500" style="--T:9.5s"><div class="stage">
  <div class="card req in" style="--d:.3s">
    <span class="chip lg">Requirement posted</span>
    <div class="t22">US tax structuring + state licensing</div>
    <div class="t16 muted" style="margin-top:6px">Buyer in India acquiring an Ohio manufacturer</div>
  </div>

  <div class="card room in" style="--d:.5s">
    <div class="hd"><span class="t22">Deal room</span></div>
    <div class="file"><span class="ico"></span><div style="flex:1"><div class="bar-skel" style="width:70%"></div></div></div>
    <div class="file new"><span class="ico"></span><span class="t18 b" style="flex:1">Structuring memo</span><span class="chip v">New</span></div>
  </div>

  <div class="props">
    <div class="lab in" style="--d:1s"><span class="t22">Proposals</span><span class="t16 muted">scope · price · timeline</span></div>
    <div class="card bid sl" style="--d:1.2s"><span class="pick"></span><div class="agent provider sm">P</div>
      <div style="flex:1"><div class="t18 b" style="padding-right:78px">Cross-border tax specialist</div><div class="skel"><div class="bar-skel" style="width:85%"></div><div class="bar-skel" style="width:55%"></div></div></div>
      <span class="chip g lg pop hired" style="--d:3.7s">Hired</span></div>
    <div class="card bid sl" style="--d:1.5s"><div class="agent provider sm">P</div>
      <div style="flex:1"><div class="t18 b">US corporate counsel</div><div class="skel"><div class="bar-skel" style="width:75%"></div><div class="bar-skel" style="width:60%"></div></div></div></div>
    <div class="card bid sl" style="--d:1.8s"><div class="agent provider sm">P</div>
      <div style="flex:1"><div class="t18 b">Accounting firm</div><div class="skel"><div class="bar-skel" style="width:80%"></div><div class="bar-skel" style="width:50%"></div></div></div></div>
  </div>

  <div class="card verdict in" style="--d:2.8s"><div class="agent ai sm">AI</div><span class="t18 b">AI agent compared · a person decides</span></div>

  <div class="fly"><span class="chip v lg">Structuring memo</span></div>
</div></body></html>
